name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove anything private (cookies, tokens, personal paths,
        private video links) before submitting. Security issues: report them privately as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run or ask your agent, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: |
        The exact command (or the one your agent ran) and its stdout. Include `ERROR:`, `HINT:` and
        `NOTE:` lines, and the exit code if you know it. Add relevant stderr if there is a traceback.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: Output of `uv run --no-project --python ">=3.11" python <skill folder>/scripts/video_watch.py doctor` (remove personal paths if you like).
      render: text
    validations:
      required: true
  - type: input
    id: video
    attributes:
      label: Public test video
      description: A public URL that reproduces the problem, if any (or "local file" with its codec and container).
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Kilo
        - Other / CLI only
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: video-watch version
      description: Release or commit.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
